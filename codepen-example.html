class SearchBar extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.render();
    this.setupEventListeners();
  }

  render() {
    this.shadowRoot.innerHTML = `
      <style>
        :host {
          display: block;
          margin-block-end: 1.5rem;
          animation: slideUp 0.6s ease-out 0.2s both;
        }

        .search-form {

          grid-template-columns: 1fr;
          gap: 0.75rem;
          container-type: inline-size;
        }

        input {
          padding: 1rem 1.25rem;
          border: none;
          border-radius: var(--radius-md, 12px);
          font-size: clamp(0.95rem, 2vw, 1.05rem);
          font-family: inherit;
          background: white;
          box-shadow: var(--shadow-md, 0 4px 16px rgba(0,0,0,0.12));
          transition: var(--transition, all 0.3s);
        }

        input:focus {
          outline: 2px solid white;
          outline-offset: 2px;
          transform: translateY(-2px);
          box-shadow: var(--shadow-lg, 0 8px 32px rgba(0,0,0,0.16));
        }

        button {
          padding: 1rem 2rem;
          border: none;
          border-radius: var(--radius-md, 12px);
          font-size: 1rem;
          font-weight: 600;
          font-family: inherit;
          cursor: pointer;
          transition: var(--transition, all 0.3s);
          box-shadow: var(--shadow-md, 0 4px 16px rgba(0,0,0,0.12));
          white-space: nowrap;
        }

        button:hover:not(:disabled) {
          transform: translateY(-2px);
          box-shadow: var(--shadow-lg, 0 8px 32px rgba(0,0,0,0.16));
        }

        button:active:not(:disabled) {
          transform: translateY(0);
        }

        button:disabled {
          opacity: 0.6;
          cursor: not-allowed;
        }

        .btn-primary {
          background: white;
          color: var(--primary-color, #667eea);
        }

        .btn-secondary {
          background: var(--secondary-color, #764ba2);
          color: white;
        }

        @container (min-width: 600px) {
          .search-form {
            grid-template-columns: 1fr auto auto;
          }
        }
      </style>

      <form class="search-form">
        <input
          type="search"
          id="searchInput"
          placeholder="Enter a topic (e.g., Deno, JavaScript, Space)"
          value="Deno_(software)"
          autocomplete="off"
        />
        <button type="submit" class="btn-primary">
          Explore
        </button>
        <button type="button" id="randomBtn" class="btn-secondary">
          🎲 Random
        </button>
      </form>
    `;
  }

  setupEventListeners() {
    const form = this.shadowRoot.querySelector('form');
    const input = this.shadowRoot.querySelector('#searchInput');
    const randomBtn = this.shadowRoot.querySelector('#randomBtn');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const topic = input.value.trim();
      if (topic) {
        this.dispatchEvent(new CustomEvent('search', {
          detail: { topic },
          bubbles: true,
          composed: true
        }));
      }
    });

    randomBtn.addEventListener('click', () => {
      this.dispatchEvent(new CustomEvent('random', {
        bubbles: true,
        composed: true
      }));
    });
  }

  setValue(value) {
    const input = this.shadowRoot.querySelector('#searchInput');
    if (input) input.value = value;
  }
}

class ArticleCard extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.render();
  }

  render() {
    this.shadowRoot.innerHTML = `
      <style>
        :host {
          display: none;
          animation: fadeIn 0.6s ease-in;
          container-type: inline-size;
          margin-block-start: 1.5rem;
        }

        :host([active]) {

        .card {
          background: var(--surface-color, white);
          border-radius: var(--radius-lg, 16px);
          overflow: hidden;
          box-shadow: var(--shadow-lg, 0 8px 32px rgba(0,0,0,0.16));

        }

          height: clamp(200px, 40cqi, 400px);
          object-fit: cover;

          display: block;
        }

        .card-content {
          padding: clamp(1.5rem, 4cqi, 2.5rem);
        }

        .card-title {
          color: var(--primary-color, #667eea);
          margin-block-end: 1.25rem;
          font-size: clamp(1.5rem, 4cqi, 2.25rem);
          font-weight: 700;
          line-height: 1.2;
          letter-spacing: -0.02em;
        }

        .card-intro {
          color: var(--text-primary, #1a1a1a);
          margin-block-end: 1.5rem;
          font-size: clamp(1rem, 2.5cqi, 1.1rem);
          line-height: 1.8;
        }

        .card-intro::part(paragraph) {
          margin-block-end: 1rem;
        }

        .categories {
          display: flex;
          flex-wrap: wrap;
          gap: 0.625rem;
          margin-block-end: 1.5rem;
        }

        .category-tag {
          background: #f5f5f5;
          color: var(--text-secondary, #666);
          padding: 0.375rem 0.875rem;
          border-radius: 9999px;
          font-size: 0.9rem;
          font-weight: 500;
          transition: var(--transition, all 0.3s);
          cursor: pointer;
          border: 2px solid transparent;
          user-select: none;
        }

        .category-tag:hover {
          background: var(--primary-color, #667eea);
          color: white;
          transform: scale(1.05);
          border-color: var(--primary-color, #667eea);
        }

        .category-tag:active {
          transform: scale(0.98);
        }

        .read-more {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          background: var(--primary-gradient, linear-gradient(135deg, #667eea 0%, #764ba2 100%));
          color: white;
          padding: 0.875rem 1.75rem;
          border-radius: 9999px;
          text-decoration: none;
          font-weight: 600;
          transition: var(--transition, all 0.3s);
          box-shadow: var(--shadow-md, 0 4px 16px rgba(0,0,0,0.12));
        }

        .read-more:hover {
          transform: translateY(-2px);
          box-shadow: var(--shadow-lg, 0 8px 32px rgba(0,0,0,0.16));
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }

        @container (max-width: 500px) {
          .categories {
            gap: 0.5rem;
          }

          .category-tag {
            font-size: 0.85rem;
            padding: 0.3rem 0.75rem;
          }
        }
      </style>

      <article class="card">
        <img class="card-image" id="image" alt="" />
        <div class="card-content">
          <h2 class="card-title" id="title"></h2>
          <div class="card-intro" id="intro"></div>
          <div class="categories" id="categories"></div>
          <a class="read-more" id="readMore" href="" target="_blank" rel="noopener">
            Read full article
            <span>→</span>
          </a>
        </div>
      </article>
    `;
  }

  setData(data, url) {
    const title = this.shadowRoot.querySelector('#title');
    const intro = this.shadowRoot.querySelector('#intro');
    const image = this.shadowRoot.querySelector('#image');
    const categories = this.shadowRoot.querySelector('#categories');
    const readMore = this.shadowRoot.querySelector('#readMore');

    // Set title
    title.textContent = data.title;

    // Set intro
    intro.innerHTML = this.formatIntro(data.intro);

    // Set image
    if (data.image) {
      const imageUrl = this.extractImageUrl(Array.isArray(data.image) ? data.image[0] : data.image);
      if (imageUrl) {
        image.src = imageUrl;
        image.alt = data.title;
      } else {
        image.removeAttribute('src');
      }
    } else {
      image.removeAttribute('src');
    }

    // Set categories
    if (data.categories && data.categories.length > 0) {
      const categoryList = Array.isArray(data.categories) ? data.categories : [data.categories];
      categories.innerHTML = categoryList
        .slice(0, 10)
        .map((cat, index) => `<button class="category-tag" data-topic="${this.escapeHtml(cat)}" data-index="${index}">${this.escapeHtml(cat)}</button>`)
        .join('');

      // Add click event listeners to category tags
      const categoryButtons = categories.querySelectorAll('.category-tag');
      categoryButtons.forEach(button => {
        button.addEventListener('click', () => {
          const topic = button.dataset.topic;
          this.dispatchEvent(new CustomEvent('select', {
            detail: { topic },
            bubbles: true,
            composed: true
          }));
        });
      });
    } else {
      categories.innerHTML = '';
    }

    // Set read more link
    readMore.href = url;

    this.setAttribute('active', '');
  }

  formatIntro(intro) {
    const cleanText = (text) => {
      // Remove CSS class patterns like .classname{...} and .classname
      let cleaned = text.replace(/\.[a-zA-Z_-]+\{[^}]*\}/g, '');
      cleaned = cleaned.replace(/\.[a-zA-Z_-]+(?=[,\s{])/g, '');
      // Remove inline style tags
      cleaned = cleaned.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '');
      // Clean up extra whitespace
      cleaned = cleaned.replace(/\s+/g, ' ').trim();
      return cleaned;
    };

    if (Array.isArray(intro)) {
      return intro
        .slice(0, 3)
        .filter(p => p.trim().length > 0)
        .map(p => `<p part="paragraph">${this.escapeHtml(cleanText(p))}</p>`)
        .join('');
    }
    return `<p part="paragraph">${this.escapeHtml(cleanText(intro))}</p>`;
  }

  extractImageUrl(imageHtml) {
    if (!imageHtml) return null;
    const match = imageHtml.match(/src="([^"]+)"/);
    if (match) {
      let url = match[1];
      if (url.startsWith('//')) {
        url = 'https:' + url;
      }
      return url;
    }
    return null;
  }

  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  hide() {
    this.removeAttribute('active');
  }
}

          background: white;
          color: var(--primary-color, #667eea);
          box-shadow: var(--shadow-md, 0 4px 16px rgba(0,0,0,0.12));
        }

        .tab-button.active::after {
          content: '';
          position: absolute;
          bottom: -2px;
          left: 0;
          right: 0;
          height: 2px;
          background: var(--primary-color, #667eea);
        }

        .tab-icon {
          margin-inline-end: 0.5rem;
        }

        .tabs-content {
          position: relative;
        }

        ::slotted(article-card) {
          display: none;
        }

        ::slotted(article-card[active]) {
          display: block;
        }
      </style>

      <div class="tabs-header">
        <button class="tab-button active" data-tab="wikipedia">
          <span class="tab-icon">📖</span>
          Wikipedia
        </button>
        <button class="tab-button" data-tab="grokipedia">
          <span class="tab-icon">🤖</span>
          Grokipedia
        </button>
      </div>

      <div class="tabs-content">
        <slot name="wikipedia"></slot>
        <slot name="grokipedia"></slot>
      </div>
    `;
  }

  setupEventListeners() {
    const buttons = this.shadowRoot.querySelectorAll('.tab-button');
    buttons.forEach(button => {
      button.addEventListener('click', () => {
        this.switchTab(button.dataset.tab);
      });
    });
  }

  switchTab(tabName) {
    this.activeTab = tabName;

    // Update button states
    const buttons = this.shadowRoot.querySelectorAll('.tab-button');
    buttons.forEach(btn => {
      if (btn.dataset.tab === tabName) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // Update article card visibility
    const cards = this.querySelectorAll('article-card');
    cards.forEach(card => {
      if (card.getAttribute('slot') === tabName) {
        card.setAttribute('active', '');
      } else {
        card.removeAttribute('active');
      }
    });
  }

  show() {
    this.setAttribute('active', '');
    // Show the active tab's content
    this.switchTab(this.activeTab);
  }

  hide() {
    this.removeAttribute('active');
    const cards = this.querySelectorAll('article-card');
    cards.forEach(card => card.hide());
  }
}

// ============================================
// Register Web Components
// ============================================
customElements.define('search-bar', SearchBar);
customElements.define('loading-spinner', LoadingSpinner);
customElements.define('error-message', ErrorMessage);
customElements.define('disambiguation-links', DisambiguationLinks);
customElements.define('tabs-container', TabsContainer);
customElements.define('article-card', ArticleCard);

// ============================================
// App Controller
// ============================================
class App {
  constructor() {
    this.searchBar = document.querySelector('search-bar');
    this.loading = document.querySelector('loading-spinner');
    this.error = document.querySelector('error-message');
    this.disambiguation = document.querySelector('disambiguation-links');
    this.tabsContainer = document.querySelector('tabs-container');
    this.wikipediaCard = document.querySelector('article-card[data-source="wikipedia"]');
    this.grokipediaCard = document.querySelector('article-card[data-source="grokipedia"]');

    this.setupEventListeners();
    this.init();
  }

  setupEventListeners() {
    document.addEventListener('search', (e) => {
      this.fetchArticle(e.detail.topic);
    });

    document.addEventListener('random', () => {
      this.fetchRandom();
    });

    document.addEventListener('select', (e) => {
      // Update search bar and fetch the selected topic
      this.searchBar.setValue(e.detail.topic);
      this.fetchArticle(e.detail.topic);
    });
  }

  async init() {
    // Load initial article
    await this.fetchArticle('Deno_(software)');
  }

  async fetchArticle(topic) {
    this.loading.show();
    this.error.hide();
    this.tabsContainer.hide();
    this.disambiguation.hide();

    // Prepare URLs for both sources
    const wikiUrl = `${WIKI_BASE}${encodeURIComponent(topic)}`;
    const grokipediaUrl = `${GROKIPEDIA_BASE}${encodeURIComponent(topic)}`;

    // Fetch from both sources in parallel
    const [wikiResult, grokipediaResult] = await Promise.allSettled([
      this.fetchFromSource(wikiUrl, extractConfig, 'Wikipedia'),
      this.fetchFromSource(grokipediaUrl, grokipediaConfig, 'Grokipedia')
    ]);

    this.loading.hide();

    // Check if at least one succeeded
    const hasSuccess = wikiResult.status === 'fulfilled' || grokipediaResult.status === 'fulfilled';

    if (!hasSuccess) {
      // Both failed
      const errors = [];
      if (wikiResult.status === 'rejected') errors.push(`Wikipedia: ${wikiResult.reason.message}`);
      if (grokipediaResult.status === 'rejected') errors.push(`Grokipedia: ${grokipediaResult.reason.message}`);
      this.error.show(`Could not find "${topic}" in either source.\n${errors.join('\n')}`);
      return;
    }

    // Handle Wikipedia result
    if (wikiResult.status === 'fulfilled') {
      const { data, url } = wikiResult.value;

      // Check if this is a disambiguation page
      const isDisambiguation = data.title.includes('disambiguation') ||
                               (data.intro && typeof data.intro === 'string' && data.intro.includes('may refer to'));

      if (isDisambiguation && data.disambiguation && Array.isArray(data.disambiguation) && data.disambiguation.length > 0) {
        this.disambiguation.setLinks(data.disambiguation, data.title.replace(' (disambiguation)', ''));
      }

      this.wikipediaCard.setData(data, url);
    } else {
      this.wikipediaCard.setData({
        title: 'Not Found',
        intro: `Could not find "${topic}" on Wikipedia. ${wikiResult.reason.message}`
      }, wikiUrl);
    }

    // Handle Grokipedia result
    if (grokipediaResult.status === 'fulfilled') {
      const { data, url } = grokipediaResult.value;
      this.grokipediaCard.setData(data, url);
    } else {
      this.grokipediaCard.setData({
        title: 'Not Found',
        intro: `Could not find "${topic}" on Grokipedia. ${grokipediaResult.reason.message}`
      }, grokipediaUrl);
    }

    // Show the tabs container
    this.tabsContainer.show();
  }

  async fetchFromSource(url, config, sourceName) {
    const apiUrl = `${API_BASE}?from=${encodeURIComponent(url)}&extract=${encodeURIComponent(JSON.stringify(config))}`;

    try {
      const response = await fetch(apiUrl);

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();

      if (!data.title || data.title === '') {
        throw new Error('No content found');
      }

      return { data, url };
    } catch (err) {
      throw new Error(`${err.message}`);
    }
  }

  async fetchRandom() {
    this.loading.show();
    this.error.hide();
    this.tabsContainer.hide();
    this.disambiguation.hide();

    const wikiUrl = `${WIKI_BASE}Special:Random`;
    const apiUrl = `${API_BASE}?from=${encodeURIComponent(wikiUrl)}&extract=${encodeURIComponent(JSON.stringify(extractConfig))}`;

    try {
      const response = await fetch(apiUrl);

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();

      // Update search input with the article title and fetch from both sources
      if (data.title) {
        const topic = data.title.replace(/ /g, '_');
        this.searchBar.setValue(topic);
        // Now fetch from both sources
        await this.fetchArticle(topic);
      } else {
        this.loading.hide();
        this.error.show('Could not fetch random article');
      }

    } catch (err) {
      console.error('Error:', err);
      this.loading.hide();
      this.error.show(`Error: ${err.message}`);
    }
  }
}

// Initialize app when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => new App());
} else {
  new App();
}
</script>
